<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфолио Всеволода Шустрова</title>
<meta name="description" content="Игровое портфолио системного аналитика: резюме и интерактивные демо — BPMN, Kafka, REST-идемпотентность и UML Sequence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
:root{
  color-scheme: dark;
  --bg:#0a0e17; --panel:#111827; --panel-2:#0d1420; --term:#070b12;
  --line:#1e293b; --line-2:#2b3a52;
  --fg:#e6edf7; --muted:#94a3b8; --dim:#64748b;
  --cyan:#22d3ee; --green:#34d399; --red:#f87171; --amber:#fbbf24; --blue:#60a5fa; --orange:#fb923c;
  --page:var(--cyan);
  --f-ui:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-display:"Unbounded","Onest","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
body[data-page="rest"]{--page:var(--green)}
body[data-page="bpmn"]{--page:var(--cyan)}
body[data-page="kafka"]{--page:var(--orange)}
body[data-page="uml"]{--page:var(--blue)}

*{box-sizing:border-box}
body{
  margin:0;color:var(--fg);font:15px/1.5 var(--f-ui);
  background-color:var(--bg);
  background-image:linear-gradient(rgba(34,211,238,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.045) 1px,transparent 1px);
  background-size:32px 32px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.mono{font-family:var(--f-mono)}
.dim{color:var(--dim)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.shell{max-width:1720px;margin:0 auto;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 0;display:flex;flex-direction:column;gap:12px}

/* HUD */
.hud{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.hud-ava{width:52px;height:52px;border-radius:10px;object-fit:cover;border:2px solid var(--page);box-shadow:0 0 0 3px color-mix(in srgb,var(--page) 18%,transparent);transition:border-color .3s}
.hud-name{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.2}
.hud-class{color:var(--muted);font-size:13px}
.hud-class b{color:var(--page);font-weight:600}
.lvl{display:flex;align-items:center;gap:12px;margin-left:auto}
.lvl-badge{font:700 13px var(--f-mono);color:var(--bg);background:var(--amber);padding:5px 10px;border-radius:6px;white-space:nowrap}
.xp{width:170px;display:flex;flex-direction:column;gap:4px}
.xp-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.xp-bar i{display:block;height:100%;width:var(--xp,0%);background:linear-gradient(90deg,var(--amber),var(--green));transition:width .6s}
.xp-t{font:11px var(--f-mono);color:var(--muted)}

/* Tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{--tabc:var(--cyan);display:flex;align-items:center;gap:8px;padding:10px 14px;color:var(--muted);text-decoration:none;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;white-space:nowrap;font-weight:500;font-size:14px}
.tab[data-tab="rest"]{--tabc:var(--green)} .tab[data-tab="kafka"]{--tabc:var(--orange)} .tab[data-tab="uml"]{--tabc:var(--blue)}
.tab:hover{color:var(--fg);background:color-mix(in srgb,var(--tabc) 7%,transparent)}
.tab[aria-current="page"]{color:var(--fg);background:var(--panel);border-color:var(--line);box-shadow:inset 0 2px 0 var(--tabc)}
.tab .k{font:600 11px var(--f-mono);color:var(--tabc);letter-spacing:.06em}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.tab.part .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--amber)}
.tab.done .dot{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.tab.running .dot{background:var(--tabc);box-shadow:0 0 6px var(--tabc);animation:blink .8s infinite alternate}

/* Workspace + log */
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.logp{background:var(--term);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;height:300px}
@media (min-width:1200px){
  .work{grid-template-columns:minmax(0,1fr) 340px}
  .logp{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));height:calc(100vh - 96px);min-height:420px}
}
.log-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.log-h b{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.log-body{flex:1;overflow:auto;padding:8px 12px;font:12px/1.6 var(--f-mono);min-height:0}
.ln{white-space:pre-wrap;word-break:break-word;padding:0 4px;border-radius:3px}
.ln time{color:var(--dim)} .ln .lv{font-weight:700} .ln .comp{color:var(--muted)}
.lv-INFO .lv{color:var(--cyan)} .lv-WARN .lv{color:var(--amber)} .lv-ERROR .lv{color:var(--red)} .lv-SUCCESS .lv{color:var(--green)}
.lv-ERROR{background:color-mix(in srgb,var(--red) 9%,transparent)}
.lv-WARN{background:color-mix(in srgb,var(--amber) 5%,transparent)}
.lv-SUCCESS{background:color-mix(in srgb,var(--green) 6%,transparent)}
.ln.sep{color:var(--dim);text-align:center;margin:6px 0}
.ln.new{animation:lnIn .5s ease-out}

.page{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.page-head > div:first-child{min-width:0;flex:1 1 420px}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--page);margin:0 0 6px}
h2{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,2.3vw,27px);line-height:1.18;margin:0 0 8px;text-wrap:balance}
.lede{color:var(--muted);max-width:72ch;margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.zone-h{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--page);margin:0 0 12px}

.btn{font:600 14px var(--f-ui);color:var(--fg);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:9px 14px;cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{background:color-mix(in srgb,var(--page) 16%,var(--panel-2));border-color:color-mix(in srgb,var(--page) 60%,transparent)}
.btn.primary:hover{background:color-mix(in srgb,var(--page) 28%,var(--panel-2));color:var(--fg);border-color:var(--page)}
.btn.danger{border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.ok{border-color:color-mix(in srgb,var(--green) 55%,transparent)}
.btn.ok:hover{border-color:var(--green);color:var(--green)}
.btn.ghost{background:transparent;font-weight:500;font-size:13px;padding:7px 11px}
.btn.sm{font-size:13px;padding:6px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line-2);color:var(--fg);background:var(--panel-2)}
.btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex:none}
.seg button{font:12px var(--f-mono);background:transparent;color:var(--muted);border:0;border-left:1px solid var(--line-2);padding:7px 10px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--page) 22%,transparent);color:var(--fg)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg-l{font:11px var(--f-mono);color:var(--dim)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted)}
.inrow{display:flex;gap:6px}
input[type="text"],input[type="date"],select{font:13px var(--f-mono);background:var(--term);color:var(--fg);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
select{font-family:var(--f-ui)}
input:focus,select:focus{border-color:var(--page);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--page) 20%,transparent)}
input:disabled,input[readonly]{color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

.switch{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--fg);cursor:pointer;padding:0;font:inherit;font-size:14px}
.switch .track{width:42px;height:22px;border-radius:11px;background:var(--red);position:relative;transition:background .2s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch[aria-checked="true"] .track{background:var(--green)}
.switch[aria-checked="true"] .track::after{transform:translateX(20px)}
.switch .sw-v{font:700 12px var(--f-mono)}
.switch[aria-checked="true"] .sw-v{color:var(--green)} .switch[aria-checked="false"] .sw-v{color:var(--red)}

details.more{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 14px}
details.more + details.more{margin-top:8px}
details.more summary{cursor:pointer;padding:11px 0;font-weight:600;font-size:14px;list-style:none;display:flex;gap:10px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";font:700 14px var(--f-mono);color:var(--page);width:12px}
details.more[open] summary::before{content:"−"}
details.more .body{padding:0 0 14px 22px;color:var(--muted);font-size:14px;max-width:84ch}
details.more .body p{margin:0 0 8px}
details.more code,.code{font:12.5px var(--f-mono);color:var(--fg);background:var(--term);padding:1px 5px;border-radius:4px}
.applied{border:1px solid var(--line);border-left:3px solid var(--page);border-radius:8px;padding:12px 14px;background:var(--panel);margin-top:12px}
.applied h3{margin:0 0 6px;font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--page)}
.applied p{margin:0;max-width:84ch}
.applied .note{margin-top:6px;color:var(--dim);font-size:13px}

/* Tooltip */
#tip{position:fixed;z-index:30;max-width:300px;background:#0b1322;border:1px solid var(--amber);color:var(--fg);font-size:12.5px;line-height:1.45;padding:7px 10px 8px;border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.55);pointer-events:none;animation:tipIn .15s ease-out;white-space:pre-line}
#tip::before{content:attr(data-kind);display:block;font:600 10px var(--f-mono);color:var(--amber);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.info{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--cyan);color:var(--cyan);font:700 11px var(--f-mono);cursor:help;background:transparent;padding:0;vertical-align:middle}
.fly-host{position:relative}
.fly-layer{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:visible}

/* Общие SVG */
.svg-stage{display:block}
.svg-stage text{fill:var(--fg);font-family:var(--f-ui)}
.pulse .shape,.pulse > rect.node-box{animation:nodePulse .85s ease-out}

/* ===== REST ===== */
.rest-grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.rest-grid{grid-template-columns:300px minmax(0,1fr)}}
.client{display:flex;flex-direction:column;gap:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
pre.req{font:12px/1.55 var(--f-mono);background:var(--term);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;overflow-x:auto;color:var(--muted);white-space:pre}
.req .h{color:var(--cyan)} .req .bad{color:var(--red)}
.resp{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--term);display:flex;flex-direction:column;gap:6px}
.resp-top{display:flex;justify-content:space-between;align-items:center}
.resp .code{font:700 13px var(--f-mono);color:var(--dim);background:none;padding:0}
.resp pre{margin:0;font:12px/1.5 var(--f-mono);color:var(--muted);white-space:pre-wrap;word-break:break-word}
.resp.ok{border-color:color-mix(in srgb,var(--green) 55%,transparent)} .resp.ok .code{color:var(--green)}
.resp.replay{border-color:color-mix(in srgb,var(--cyan) 55%,transparent)} .resp.replay .code{color:var(--cyan)}
.resp.warn{border-color:color-mix(in srgb,var(--amber) 55%,transparent)} .resp.warn .code{color:var(--amber)}
.resp.bad{border-color:var(--red)} .resp.bad .code{color:var(--red)}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;gap:10px;align-items:baseline;text-align:left;font:500 13px var(--f-ui);color:var(--fg);background:transparent;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;cursor:pointer}
.chip:hover{border-color:var(--page)}
.chip .n{font:700 12px var(--f-mono);color:var(--page)}
.chip small{display:block;color:var(--dim);font-size:12px;font-weight:400}
.stage-scroll{overflow:auto;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
#rest-stage{display:flex}
#rest-stage .stage-inner{min-width:620px;flex:1;display:flex;align-items:center;padding:8px}
#rest-svg{width:100%;height:auto}
.node-box{fill:var(--panel-2);stroke:var(--line-2);stroke-width:1.5}
.node-t{font-size:15px;font-weight:600}
.svg-stage .node-s,.svg-stage .t-dim{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.wire{fill:none;stroke:var(--line-2);stroke-width:2;stroke-dasharray:5 6}
.wire.live{stroke:var(--page);animation:dash .5s linear infinite}
.svg-stage .wire-l{font:11px var(--f-mono);fill:var(--dim)}
.pkt .halo{opacity:.22}
.svg-stage .pkt-l{font:700 11px var(--f-mono)}
.row-bg{fill:#0a111d;stroke:var(--line)}
.row.new .row-bg{animation:rowIn 1.1s ease-out}
.row.dup .row-bg{fill:color-mix(in srgb,var(--red) 22%,#0a111d);stroke:var(--red);animation:dupBlink .45s 6 alternate}
.row.dupd .row-bg{fill:color-mix(in srgb,var(--red) 18%,#0a111d);stroke:var(--red)}
.row.hit .row-bg{fill:color-mix(in srgb,var(--cyan) 18%,#0a111d);stroke:var(--cyan)}
.row text{font:12px var(--f-mono)}
.svg-stage .t-ok{fill:var(--green)} .svg-stage .t-bad{fill:var(--red)}
.svg-stage .t-empty{fill:var(--dim);font:12px var(--f-mono)}

/* ===== BPMN ===== */
.bp-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bp-controls .sp{flex:1}
.bp-wrap{position:relative}
#bp-stage{max-height:78vh}
#bp-svg text{font-family:var(--f-ui)}
.pool{fill:transparent;stroke:var(--line-2);stroke-width:1.5}
.pool-h{fill:color-mix(in srgb,var(--cyan) 8%,var(--panel));stroke:var(--line-2)}
.lane-h{fill:color-mix(in srgb,var(--cyan) 4%,var(--panel));stroke:var(--line)}
.lane-sep{stroke:var(--line-2);stroke-width:1}
#bp-svg .pool-t{font-size:12px;font-weight:600;fill:var(--cyan);letter-spacing:.04em}
#bp-svg .lane-t{font-size:12px;font-weight:500;fill:var(--muted)}
.bn .shape{fill:var(--panel-2);stroke:color-mix(in srgb,var(--cyan) 45%,var(--line-2));stroke-width:1.6;transition:stroke .3s,fill .3s}
#bp-svg .bn.task text{font-size:12.5px;text-anchor:middle;fill:var(--fg)}
.bn.gw .mark{stroke:var(--fg);stroke-width:3;fill:none;stroke-linecap:round}
.bn.ev .shape{stroke:var(--fg);stroke-width:1.8}
.bn.ev.start .shape{stroke:var(--green)}
.bn.ev.end .shape{stroke-width:4.5}
.bn .ring{fill:none;stroke:var(--fg);stroke-width:1.3}
.bn .env{fill:none;stroke:var(--fg);stroke-width:1.3;stroke-linejoin:round}
.bn .env.fill{fill:var(--fg);stroke:var(--panel-2)}
.bn .clock{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-linecap:round}
.bn.active .shape{stroke:var(--cyan);stroke-width:2.6;fill:color-mix(in srgb,var(--cyan) 16%,var(--panel-2));filter:url(#bp-glow)}
.bn.completed .shape{stroke:var(--green);fill:color-mix(in srgb,var(--green) 8%,var(--panel-2))}
.bn.cancelled .shape{stroke:var(--red);fill:color-mix(in srgb,var(--red) 11%,var(--panel-2));stroke-dasharray:5 3}
#bp-svg .bn.cancelled text{fill:var(--red)}
.bn.timer.armed .shape{stroke:var(--amber);filter:url(#bp-glow)}
.bn.timer.fired .shape{stroke:var(--red);fill:color-mix(in srgb,var(--red) 20%,var(--panel-2))}
.flow{fill:none;stroke:var(--dim);stroke-width:1.8;marker-end:url(#bp-arr)}
.flow.live{stroke:var(--cyan);stroke-width:2.4}
.flow.done{stroke:color-mix(in srgb,var(--green) 70%,var(--dim))}
.flow.cancelled{stroke:var(--red)}
.flow.msg{stroke-dasharray:7 5;marker-end:url(#bp-arr-open);marker-start:url(#bp-circ)}
.flow.msg.live{stroke:var(--amber)}
.mflow .hit,.sflow .hit{stroke:transparent;stroke-width:16;fill:none}
#bp-svg .bp-l{font-size:11.5px;fill:var(--muted)}
#bp-svg .bp-cond{font-size:11px;font-weight:600;font-family:var(--f-mono);fill:var(--cyan)}
#bp-svg .bp-count{font-size:12px;font-weight:700;font-family:var(--f-mono);fill:var(--amber)}
.tok-core{fill:var(--cyan);filter:url(#bp-glow)}
.tok-trail{fill:var(--cyan)}
.tok-env rect,.tok-env path{fill:var(--amber);stroke:var(--bg);stroke-width:1}
.bp-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--cyan);border-radius:12px;padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 4px color-mix(in srgb,var(--cyan) 14%,transparent);z-index:7;width:min(380px,92%);display:flex;flex-direction:column;gap:12px}
.bp-modal h4{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600}
.bp-modal p{margin:0;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;color:var(--muted);font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.sim-note{font:12px var(--f-mono);color:var(--amber);border:1px dashed color-mix(in srgb,var(--amber) 55%,transparent);border-radius:6px;padding:4px 8px}
.bp-status{font:12px var(--f-mono);color:var(--muted)}
.bp-status b{color:var(--fg)}

/* ===== KAFKA ===== */
.kf-pipe{display:flex;flex-wrap:wrap;align-items:center;gap:6px;list-style:none;margin:0 0 12px;padding:0;font:12px var(--f-mono)}
.kf-pipe li{padding:5px 10px;border:1px solid var(--line-2);border-radius:6px;color:var(--muted);transition:all .2s}
.kf-pipe .arr{border:0;padding:0;color:var(--dim)}
.kf-pipe li.on{border-color:var(--orange);color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 18%,transparent)}
.kf-grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1320px){.kf-grid{grid-template-columns:250px minmax(0,1fr) 270px}}
.kf-prod{display:flex;flex-direction:column;gap:10px}
.kf-node{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);font-size:13px}
.kf-node b{font-family:var(--f-mono);font-size:12px}
.kf-node.flash{border-color:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 20%,transparent)}
.kf-node .ico{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange);font:700 12px var(--f-mono);flex:none}
.kf-part-calc{font:11.5px var(--f-mono);color:var(--muted)}
.kf-part-calc b{color:var(--orange)}
.kf-keyline{display:flex;align-items:center;gap:8px;font:12.5px var(--f-mono);color:var(--muted)}
.kf-keyline b{color:var(--fg)}
.kf-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kf-topic{display:flex;flex-direction:column;gap:8px;min-width:0}
.kf-prow{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-2);min-width:0}
.kf-phead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:12px;margin-bottom:6px}
.kf-phead b{font:700 13px var(--f-mono)}
.kf-phead .meta{font:11.5px var(--f-mono);color:var(--muted)}
.kf-phead .own{margin-left:auto;font:11.5px var(--f-mono);color:var(--orange)}
.kf-phead .own.none{color:var(--red)}
.kf-cells-wrap{overflow-x:auto;padding:4px 2px 4px 6px}
.kf-cells{display:flex;gap:5px;min-height:42px}
.kf-cell{flex:none;width:48px;height:40px;border-radius:6px;border:1px solid var(--line-2);background:var(--term);color:var(--fg);font:10px/1.15 var(--f-mono);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative}
.kf-cell .o{font-weight:700;font-size:11px}
.kf-cell .k{color:var(--muted);font-size:9.5px}
.kf-cell.st-pending{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,var(--term))}
.kf-cell.st-processing{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 16%,var(--term));animation:cellGlow 1s infinite alternate}
.kf-cell.st-processed{border-color:color-mix(in srgb,var(--green) 55%,transparent);background:color-mix(in srgb,var(--green) 8%,var(--term))}
.kf-cell.st-retrying{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,var(--term));animation:blink .4s infinite alternate}
.kf-cell.st-dlq{border:1px dashed var(--red);background:color-mix(in srgb,var(--red) 10%,var(--term))}
.kf-cell.sel{outline:2px solid var(--cyan);outline-offset:1px}
.kf-cell.cm::before{content:"";position:absolute;left:-5px;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.kf-cell.ghost{border-style:dashed;color:var(--dim);cursor:default;background:transparent}
.kf-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:11px var(--f-mono);color:var(--muted)}
.kf-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid}
.kf-group-h{font:11.5px var(--f-mono);color:var(--muted);margin:-4px 0 10px}
.kf-group-h b{color:var(--fg)}
.kf-group-h .rb{color:var(--amber)}
.kf-cons-list{display:flex;flex-direction:column;gap:8px}
.kf-cons{border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;background:var(--panel-2);transition:border-color .3s}
.kf-cons .top{display:flex;align-items:center;gap:8px;font-size:13px}
.kf-cons .stt{margin-left:auto;font:700 10.5px var(--f-mono);padding:2px 6px;border-radius:4px;color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.kf
